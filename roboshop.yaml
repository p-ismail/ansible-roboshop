- name: create ec2 and r53 records
  hosts: all
  connection: local
  vars:
    sg_id: sg-0fc300ed6d5217c2f
    ami_id: ami-0220d79f3f480ecf5
    env: dev
    action: create
    domain_name: daws70s.online
    instances:
    - mongodb
    - catalogue
  tasks:
  - name: create the ec2 instance
    amazon.aws.ec2_instance:
      instance_type: "t3.micro"
      security_group: "{{ sg_id }}"
      image_id: "{{ ami_id }}"
      name: "{{ item }}-{{ env }}"
      tags:
        Project: roboshop
        Component: "{{ item }}"
        Environment: "{{ env }}"
        Name: "{{ item }}-{{ env }}"
    loop: "{{ instances }}"
    register: ec2_output
    when: action == "create"

  - name: print the ec2_output
    ansible.builtin.debug:
      msg: "{{ ec2_output }}"
    when: action == "create"

  - name: create r53 records
    amazon.aws.route53:
      state: present
      zone: "{{ domain_name }}"
      record: "{{ item.item }}-{{ env }}.{{ domain_name }}" # here mongo-dev.daws70s.online ,frontend-dev.daws70s.online
      type: A
      ttl: 1
      value: "{{ item.instances[0].private_ip_address }}" # it will assign the ip address 
      wait: true
    loop: "{{ ec2_output.results }}"
    when: action == "create"
  
  - name: create r53 records
    amazon.aws.route53:
      state: present
      zone: "{{ domain_name }}"
      record: " roboshop-{{ env }}.{{ domain_name }}" # here roboshop.daws70s.online 
      type: A
      ttl: 1
      value: "{{ item.instances[0].public_ip_address }}" # it will assign the ip address 
      wait: true
    loop: "{{ ec2_output.results }}"
    when: 
    - item.item == "frontend"
    - action == "create"